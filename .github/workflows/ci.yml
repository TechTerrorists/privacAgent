name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are wasted work, but every commit on main keeps its own
  # green record: cancelling there would leave a merge marked "cancelled",
  # which the merge rules treat as not-passing.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      PA_TEST_REDIS_URL: 'redis://127.0.0.1:6379/15'
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.17'

      - name: Install Python dependencies
        run: uv sync --locked --python 3.12

      - name: Check generated protocol
        run: pnpm protocol:check

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  dom-walker:
    name: DOM walker browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox
      - name: Test DOM walker and B-08 mock sites
        run: pnpm test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dom-walker-browser-results
          path: test-results/

  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [chrome, firefox]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:${{ matrix.target }}

      - name: Verify lifecycle host entry points
        run: |
          test -f packages/extension/dist/${{ matrix.target }}/src/host/offscreen.html
          test -f packages/extension/dist/${{ matrix.target }}/src/host/ml-worker.js

      - name: Lint the Firefox build with web-ext
        if: matrix.target == 'firefox'
        run: pnpm --filter @privacagent/extension lint:firefox

      - name: Upload unpacked extension
        uses: actions/upload-artifact@v4
        with:
          name: extension-${{ matrix.target }}
          path: packages/extension/dist/${{ matrix.target }}
          if-no-files-found: error
