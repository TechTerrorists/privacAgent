[project]
name = "privacagent-workspace"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["privacagent-protocol"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/protocol"]

[tool.uv.sources]
privacagent-protocol = { workspace = true }

[dependency-groups]
dev = ["datamodel-code-generator[black,isort]>=0.82,<1", "pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["packages/protocol/tests"]

[tool.black]
target-version = ["py312"]
